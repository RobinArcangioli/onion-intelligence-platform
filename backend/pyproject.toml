[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onion-intelligence-platform-backend"
version = "0.9.0"
description = "OIP authorized Tor collection, offline CTI signals, alerts and bounded reporting"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.35,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx[socks]>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
