name: onion-intelligence-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${OIP_DB_USER:?Configurer OIP_DB_USER}
      POSTGRES_DB: ${OIP_DB_NAME:?Configurer OIP_DB_NAME}
      POSTGRES_PASSWORD: ${OIP_DB_PASSWORD:?Configurer OIP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]
    restart: unless-stopped
    pids_limit: 128

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      OIP_DATABASE_URL: postgresql+psycopg://${OIP_DB_USER:?required}:${OIP_DB_PASSWORD:?required}@db:5432/${OIP_DB_NAME:?required}
      OIP_API_KEY: ${OIP_API_KEY:?Configurer OIP_API_KEY}
      OIP_LEGACY_API_KEY_ENABLED: ${OIP_LEGACY_API_KEY_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    pids_limit: 128

  gateway:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    networks: [ingress, private]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    pids_limit: 128

  tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    # Only the non-secret repository files inspected by tests are mounted.
    environment:
      OIP_TEST_REPO_ROOT: /app
      OIP_TEST_FRONTEND_PACKAGE: /app/tests/frontend-package.json
      OIP_TEST_FRONTEND_TS_LOADER: /app/tests/frontend-ts-loader.mjs
    volumes:
      - ./compose.yaml:/app/compose.yaml:ro
      - ./scripts:/app/scripts:ro
      - ./frontend/Dockerfile:/app/frontend/Dockerfile:ro
      # Read-only individual artifacts, rather than mounting the entire frontend tree.
      - ./frontend/package.json:/app/tests/frontend-package.json:ro
      - ./frontend/tests/ts-loader.mjs:/app/tests/frontend-ts-loader.mjs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 128

  tor:
    profiles: [tor]
    build:
      context: ./infrastructure/tor
    networks: [tor_proxy, tor_egress]
    volumes:
      - tor_data:/var/lib/tor
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    pids_limit: 128

  collector:
    profiles: [tor]
    build:
      context: ./backend
      target: runtime
    entrypoint: ["python", "-m", "app.collector.cli"]
    environment:
      OIP_DATABASE_URL: postgresql+psycopg://${OIP_DB_USER:?required}:${OIP_DB_PASSWORD:?required}@db:5432/${OIP_DB_NAME:?required}
      OIP_TOR_COLLECTION_ENABLED: ${OIP_TOR_COLLECTION_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started
    networks: [private, tor_proxy]
    read_only: true
    tmpfs: [/tmp]
    init: true
    pids_limit: 64
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true



  queue_worker:
    profiles: [tor]
    build:
      context: ./backend
      target: runtime
    entrypoint: ["python", "-m", "app.collector.worker"]
    environment:
      OIP_DATABASE_URL: postgresql+psycopg://${OIP_DB_USER:?required}:${OIP_DB_PASSWORD:?required}@db:5432/${OIP_DB_NAME:?required}
      OIP_TOR_COLLECTION_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started
    networks: [private, tor_proxy]
    read_only: true
    tmpfs: [/tmp]
    init: true
    pids_limit: 64
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped


volumes:
  postgres_data:
  tor_data:

networks:
  tor_proxy:
    internal: true
  tor_egress:
    driver: bridge
  private:
    internal: true
  ingress:
    driver: bridge
