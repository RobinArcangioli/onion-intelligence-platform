name: onion-intelligence-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${OIP_DB_USER:?Configurer OIP_DB_USER}
      POSTGRES_DB: ${OIP_DB_NAME:?Configurer OIP_DB_NAME}
      POSTGRES_PASSWORD: ${OIP_DB_PASSWORD:?Configurer OIP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      OIP_DATABASE_URL: postgresql+psycopg://${OIP_DB_USER:?required}:${OIP_DB_PASSWORD:?required}@db:5432/${OIP_DB_NAME:?required}
      OIP_API_KEY: ${OIP_API_KEY:?Configurer OIP_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    networks: [ingress, private]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none


  tor:
    profiles: [tor]
    build:
      context: ./infrastructure/tor
    networks: [tor_proxy, tor_egress]
    volumes:
      - tor_data:/var/lib/tor
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  collector:
    profiles: [tor]
    build:
      context: ./backend
      target: runtime
    entrypoint: ["python", "-m", "app.collector.cli"]
    environment:
      OIP_DATABASE_URL: postgresql+psycopg://${OIP_DB_USER:?required}:${OIP_DB_PASSWORD:?required}@db:5432/${OIP_DB_NAME:?required}
      OIP_TOR_COLLECTION_ENABLED: ${OIP_TOR_COLLECTION_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started
    networks: [private, tor_proxy]
    read_only: true
    tmpfs: [/tmp]
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true



volumes:
  postgres_data:
  tor_data:

networks:
  tor_proxy:
    internal: true
  tor_egress:
    driver: bridge
  private:
    internal: true
  ingress:
    driver: bridge
