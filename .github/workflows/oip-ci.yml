name: OIP validation (no deployment)

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and OVH policies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit staged source tree (not historical publication approval)
        run: python scripts/ci-index-audit.py
      - name: Install test dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Backend unit tests (offline Onion)
        run: python -m pytest -q -p no:cacheprovider backend/tests
      - name: Install nginx for syntax validation of private ingress
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx-core
      - name: OVH fail-closed policy tests
        run: python -m unittest discover -s deploy/ovh/tests -v
      - name: Shell syntax and Python compile
        run: |
          for script in scripts/*.sh deploy/ovh/*.sh; do
            bash -n "$script"
          done
          python -m compileall -q deploy/ovh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Typecheck and production build
        run: npm run build

  postgres17-m4b:
    name: M4-B PostgreSQL 17 isolated rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oip_test
          POSTGRES_PASSWORD: local_ci_fixture_only
          POSTGRES_DB: oip_m4b_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U oip_test -d oip_m4b_test"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: M4-B PostgreSQL migration, FTS and EXPLAIN
        env:
          PG_TEST_PASSWORD: local_ci_fixture_only
          OIP_M4B_REQUIRE_DATABASE: "1"
        run: |
          export OIP_M4B_TEST_DSN="postgresql+psycopg://oip_test:${PG_TEST_PASSWORD}@127.0.0.1:5432/oip_m4b_test"
          python -m pytest -q -s backend/tests/test_m4b_postgres17.py

  postgres17-m7c:
    name: M7-C PostgreSQL 17 migrations and concurrency (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oip_test
          POSTGRES_PASSWORD: local_ci_fixture_only
          POSTGRES_DB: oip_m7c_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U oip_test -d oip_m7c_test"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Rehearse complete migrations and concurrent identity/case writes
        env:
          PG_TEST_PASSWORD: local_ci_fixture_only
          OIP_M7C_REQUIRE_DATABASE: "1"
        run: |
          export OIP_M7C_TEST_DSN="postgresql+psycopg://oip_test:${PG_TEST_PASSWORD}@127.0.0.1:5432/oip_m7c_test"
          python -m pytest -q backend/tests/test_m7c_postgres17.py backend/tests/test_m7c_safety.py
