# Single-user private SSH-tunnel ingress. No DNS or externally hosted UI is enabled.
# API auth is enforced independently by FastAPI; nginx is only a defensive boundary.
limit_req_zone $binary_remote_addr zone=oip_api:10m rate=10r/s;

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;
    access_log off;
    client_max_body_size 1m;

    # Refuse DNS-rebinding / arbitrary Host headers at the private ingress.
    # Revisit this explicit allowlist if a private DNS name or reverse proxy is added.
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 421; }

    # Apply to successful AND error responses from every location. Do not set
    # location-specific add_header directives: that would cancel inheritance.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Documentation is available only on the internal API, not through nginx.
    # Never route these unauthenticated introspection pages from the dashboard.
    location = /docs { return 404; }
    location = /docs/ { return 404; }
    location = /redoc { return 404; }
    location = /redoc/ { return 404; }
    location = /openapi.json { return 404; }

    location /api/ {
        limit_req zone=oip_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ /\. { return 404; }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
